{{{alertaHtml}}}
<section class="tarjeta ficha">
  <div class="ficha-cabecera">
    <div>
      <p class="ficha-etiqueta">Folio</p>
      <p class="ficha-folio">{{folio}}</p>
    </div>
    <span class="etiqueta-estado {{claseEstado}}">{{estado}}</span>
  </div>
  <dl class="datos">
    <dt>Cliente</dt><dd>{{cliente}}</dd>
    <dt>Equipo</dt><dd>{{equipo}}</dd>
    <dt>Problema reportado</dt><dd>{{problema}}</dd>
    <dt>Prioridad</dt><dd>{{prioridad}}</dd>
    <dt>Fecha de recepción</dt><dd>{{recepcion}}</dd>
    <dt>Entrega estimada</dt><dd>{{entrega}}</dd>
    <dt>Costo estimado</dt><dd>{{costo}}</dd>
  </dl>
</section>
<div class="botones">{{{accionesHtml}}}</div>
