# Conexión a PostgreSQL. Estos datos se ven en pgAdmin 4:
#   clic derecho en tu servidor > Properties > Connection (host, puerto, usuario)
#   y el nombre de la base es el que aparece bajo "Databases" en el árbol.
# Cualquier valor se puede sobrescribir con variables de entorno (MUNDOLAP_BD_HOST, MUNDOLAP_BD_PUERTO,
# MUNDOLAP_BD_NOMBRE, MUNDOLAP_BD_USUARIO, MUNDOLAP_BD_CLAVE), lo recomendado para no dejar la clave aquí.
bd.host=localhost
bd.puerto=5432
bd.nombre=Mundo_Lap
bd.usuario=postgres
bd.clave=
