# Conexión a PostgreSQL. Estos datos se ven en pgAdmin 4:
#   clic derecho en tu servidor > Properties > Connection (host, puerto, usuario).
# Si la base Mundo_Lap no existe, el sistema la crea al arrancar, junto con sus tablas
# (dentro del esquema "mundolap").
#
# CONTRASEÑA: no la escribas aquí (este archivo se sube a GitHub). Copia el archivo
# bd.local.properties.ejemplo de esta misma carpeta, renómbralo a bd.local.properties y escribe
# tu contraseña en él. Git lo ignora y sus valores tienen prioridad sobre este archivo.
bd.host=localhost
bd.puerto=5432
bd.nombre=Mundo_Lap
bd.usuario=postgres
bd.esquema=mundolap
bd.clave=
